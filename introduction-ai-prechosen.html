<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style-landing.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;500;600;700&display=swap" rel="stylesheet">

    <title>Introduction import</title>

    <style>
        .box h1{
            margin: 0 0 60px 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Manuelle Auswahl.</h1>

        <div class="options">
            <div class="radio-options">
                <input type="radio" id="ultralight" name="service" value="ultralight">
                <label for="ultralight">Ultraleicht</label>
            </div>
            <div class="radio-options">
                <input type="radio" id="light" name="service" value="light">
                <label for="light">Leicht</label>
            </div>
            <div class="radio-options">
                <input type="radio" id="medium" name="service" value="medium">
                <label for="medium">Mittel</label>
            </div>
            <div class="radio-options">
                <input type="radio" id="large" name="service" value="large">
                <label for="large">Groß</label>
            </div>
        </div>

        <div class="button-row">
            <a class="secondary-button" href="">Später auswählen</a>
            <a  class="primary-button">Auswählen</a>
        </div>
    </div>

    <a class="return-button" href="introduction-ai.html">
        <img src="images/back-arrow.svg" alt="Go back">
    </a>
</body>
</html>
